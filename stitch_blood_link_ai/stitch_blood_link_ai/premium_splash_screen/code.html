<script>
        // Micro-interaction for device orientation parallax if supported
        window.addEventListener('deviceorientation', (event) => {
            const drop = document.querySelector('.animate-float');
            const watermark = document.querySelector('.watermark-subtle');
            
            if (event.beta && event.gamma) {
                const x = event.gamma / 30; // -3 to 3 range roughly
                const y = event.beta / 30;
                
                if (drop) {
                    drop.style.transform = `translate(${x * 5}px, ${y * 5}px)`;
                }
                if (watermark) {
                    watermark.style.transform = `scale(1.25) translate(${-x * 10}px, ${-y * 10}px)`;
                }
            }
        });

        // Simulating the transition out of splash screen after a delay
        // This is just a UI demonstration of "premium feel"
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Blood Link splash screen initialized.');
        });
    </script>
